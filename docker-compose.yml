services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NEXORA_ENV: production
      NEXORA_DB_PATH: /app/data/nexora.db
      NEXORA_SECRET_KEY: ${NEXORA_SECRET_KEY:?Set NEXORA_SECRET_KEY in .env}
      NEXORA_SESSION_HOURS: ${NEXORA_SESSION_HOURS:-12}
      NEXORA_CORS_ORIGINS: https://${NEXORA_DOMAIN:?Set NEXORA_DOMAIN in .env}
    volumes:
      - nexora_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: https://${NEXORA_DOMAIN:?Set NEXORA_DOMAIN in .env}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status < 500 ? 0 : 1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    environment:
      NEXORA_DOMAIN: ${NEXORA_DOMAIN:?Set NEXORA_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  nexora_data:
  caddy_data:
  caddy_config:
